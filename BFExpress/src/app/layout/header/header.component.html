<header class="site-header">
  <div class="container row" style="justify-content:space-between;">
    <div class="brand">
      <a routerLink="/" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
        <span style="font-size:1.5rem;font-weight:900;color:var(--brand);">BFExpress</span>
      </a>
    </div>
    <nav class="main-nav">
      <a routerLink="/">Accueil</a>

      <!-- Dynamic Dashboard link based on role -->
      <a *ngIf="authService.getRole() === 'ADMIN'" routerLink="/dashboard-admin" class="nav-button" style="background:#ef4444;color:white;">Dashboard Admin</a>
      <a *ngIf="authService.getRole() === 'CLIENT'" routerLink="/dashboard" class="nav-button" style="background:var(--brand);color:white;">Espace Client</a>
      <a *ngIf="authService.getRole() === 'LIVREUR'" routerLink="/dashboard-livreur" class="nav-button" style="background:#8b5cf6;color:white;">Espace Livreur</a>

      <a routerLink="/contact">Contact</a>

      <!-- Login / Logout controls -->
      <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="nav-button login-button">Se connecter</a>
      <button *ngIf="authService.isLoggedIn()" (click)="logout()" class="nav-button" style="background:#e2e8f0;color:#334155;border:none;cursor:pointer;">Déconnexion</button>
    </nav>
  </div>
</header>
