<header class="modern-header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/" class="logo-link">
        <span class="logo-text">BFExpress</span>
        <span class="logo-dot">.</span>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav-menu">
      <!-- Dashboard links when logged in -->
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'ADMIN'" routerLink="/dashboard-admin" class="nav-link dashboard-link">Admin</a>
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'CLIENT'" routerLink="/dashboard" class="nav-link dashboard-link">Mon Espace</a>
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'LIVREUR'" routerLink="/dashboard-livreur" class="nav-link dashboard-link">Livreur</a>
    </nav>

    <!-- Auth Button replaced by Hamburger Menu -->
    <div class="auth-section">
      <button class="hamburger-menu" (click)="toggleMenu()" *ngIf="!authService.isLoggedIn()">
        <span class="hamburger-icon">☰</span>
      </button>
      
      <!-- Dropdown Menu -->
      <div class="dropdown-menu" *ngIf="showMenu && !authService.isLoggedIn()">
        <a routerLink="/" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">🏠</span>
          <span>Accueil</span>
        </a>
        <a routerLink="/contact" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">�</span>
          <span>Contact</span>
        </a>
        <a routerLink="/devenir-client" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">👤</span>
          <span>Devenir Client</span>
        </a>
        <a routerLink="/devenir-livreur" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">🚚</span>
          <span>Devenir Livreur</span>
        </a>
        <a routerLink="/login" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">�</span>
          <span>Se connecter</span>
        </a>
      </div>
      
      <div *ngIf="authService.isLoggedIn()" class="user-menu">
        <div class="user-info">
          <span class="user-name">{{ authService.getCurrentUser()?.prenom }} {{ authService.getCurrentUser()?.nom }}</span>
          <span class="user-role">{{ authService.getRole() }}</span>
        </div>
        <button (click)="logout()" class="btn-logout">
          <span>🚪</span>
        </button>
      </div>
    </div>
  </div>
</header>
