<header class="modern-header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/" class="logo-link">
        <span class="logo-text">BFExpress</span>
        <span class="logo-dot">.</span>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav-menu">
      <!-- Dashboard links when logged in - REMOVED per user request -->
    </nav>

    <!-- Auth Button replaced by Hamburger Menu -->
    <div class="auth-section">
      <button class="hamburger-menu" (click)="toggleMenu()" *ngIf="!authService.isLoggedIn()">
        <span class="hamburger-icon">☰</span>
      </button>
      
      <!-- Dropdown Menu for non-logged users -->
      <div class="dropdown-menu" *ngIf="showMenu && !authService.isLoggedIn()">
        <a routerLink="/" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">🏠</span>
          <span>Accueil</span>
        </a>
        <a routerLink="/contact" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">📞</span>
          <span>Contact</span>
        </a>
        <a routerLink="/devenir-client" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">👤</span>
          <span>Devenir Client</span>
        </a>
        <a routerLink="/devenir-livreur" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">🚚</span>
          <span>Devenir Livreur</span>
        </a>
        <a routerLink="/login" (click)="closeMenu()" class="dropdown-item">
          <span class="dropdown-icon">🔑</span>
          <span>Se connecter</span>
        </a>
      </div>
      
      <!-- Notification and Hamburger Menu for logged users -->
      <div class="logged-user-menu" *ngIf="authService.isLoggedIn()">
        <button class="notification-btn">
          <span class="notification-icon">🔔</span>
          <span class="notification-badge">3</span>
        </button>
        <button class="hamburger-menu" (click)="toggleMenu()">
          <span class="hamburger-icon">☰</span>
        </button>
        
        <!-- Dropdown Menu for logged users -->
        <div class="dropdown-menu" *ngIf="showMenu">
          <a *ngIf="authService.getRole() === 'CLIENT'" routerLink="/dashboard" (click)="closeMenu()" class="dropdown-item">
            <span class="dropdown-icon">📊</span>
            <span>Mon Espace</span>
          </a>
          <a *ngIf="authService.getRole() === 'ADMIN'" routerLink="/dashboard-admin" (click)="closeMenu()" class="dropdown-item">
            <span class="dropdown-icon">📊</span>
            <span>Admin</span>
          </a>
          <a *ngIf="authService.getRole() === 'LIVREUR'" routerLink="/dashboard-livreur" (click)="closeMenu()" class="dropdown-item">
            <span class="dropdown-icon">📊</span>
            <span>Livreur</span>
          </a>
          <a routerLink="/contact" (click)="closeMenu()" class="dropdown-item">
            <span class="dropdown-icon">📞</span>
            <span>Contact</span>
          </a>
          <a (click)="logout(); closeMenu()" class="dropdown-item logout-item">
            <span class="dropdown-icon">🚪</span>
            <span>Déconnexion</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
