<header class="modern-header">
  <div class="header-container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/" class="logo-link">
        <span class="logo-text">BFExpress</span>
        <span class="logo-dot">.</span>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav-menu">
      <a routerLink="/" class="nav-link active">Accueil</a>
      <a routerLink="/contact" class="nav-link">Contact</a>
      
      <!-- Dashboard links when logged in -->
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'ADMIN'" routerLink="/dashboard-admin" class="nav-link dashboard-link">Admin</a>
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'CLIENT'" routerLink="/dashboard" class="nav-link dashboard-link">Mon Espace</a>
      <a *ngIf="authService.isLoggedIn() && authService.getRole() === 'LIVREUR'" routerLink="/dashboard-livreur" class="nav-link dashboard-link">Livreur</a>
    </nav>

    <!-- Auth Button -->
    <div class="auth-section">
      <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="btn-login">
        <span class="btn-icon">🔐</span>
        <span class="btn-text">Connexion</span>
      </a>
      
      <div *ngIf="authService.isLoggedIn()" class="user-menu">
        <div class="user-info">
          <span class="user-name">{{ authService.getCurrentUser()?.prenom }} {{ authService.getCurrentUser()?.nom }}</span>
          <span class="user-role">{{ authService.getRole() }}</span>
        </div>
        <button (click)="logout()" class="btn-logout">
          <span>🚪</span>
        </button>
      </div>
    </div>
  </div>
</header>
