<section class="login-page">
  <div class="container login-card">
    <div class="login-panel">
      <div class="login-left">
        <h1>Bienvenue sur BFExpress</h1>
        <p>Connectez-vous pour accéder à votre espace et suivre vos commandes.</p>
      </div>
      <div class="login-right">
        <div class="login-box">
          <h2>Connexion</h2>
          <form (submit)="onSubmit()">
            <label>Adresse Email</label>
            <input type="email" name="email" [(ngModel)]="email" placeholder="Entrez votre email" required />
            
            <label>Mot de passe</label>
            <input type="password" name="motDePasse" [(ngModel)]="motDePasse" placeholder="Entrez votre mot de passe" required />
            
            <div class="error-banner" *ngIf="errorMessage">
              ⚠️ {{ errorMessage }}
            </div>
            
            <button type="submit" class="btn-primary" [disabled]="loading">
              {{ loading ? 'Connexion en cours...' : 'Connexion' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
