<section class="login-page">
  <div class="container login-card">
    <div class="login-panel">
      <div class="login-left">
        <h1>Bienvenue sur BFExpress</h1>
        <p>Connectez-vous pour accéder à votre espace et suivre vos commandes.</p>
      </div>
      <div class="login-right">
        <div class="login-box">
          <h2>Connexion</h2>
          <label>Nom d'utilisateur</label>
          <input type="text" placeholder="Entrez votre identifiant" />
          <label>Mot de passe</label>
          <input type="password" placeholder="Entrez votre mot de passe" />
          <button class="primary" routerLink="/dashboard">Connexion</button>
        </div>
      </div>
    </div>
  </div>
</section>
