<section class="page-section">
  <div class="container">
    <div class="form-card">
      <form (ngSubmit)="onSubmit()">
        <div class="field-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required />
        </div>
        <div class="field-group">
          <label>Mot de passe</label>
          <input type="password" name="motDePasse" [(ngModel)]="motDePasse" placeholder="Mot de passe" required />
        </div>

        <div class="error-banner" *ngIf="errorMessage">
          ⚠️ {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Connexion en cours...' : 'Connexion' }}
        </button>
      </form>

      <div class="signup-options">
        <p class="signup-text">Pas encore de compte ?</p>
        <div class="signup-links">
          <a routerLink="/devenir-client" class="signup-link client">Devenir Client</a>
          <a routerLink="/devenir-livreur" class="signup-link livreur">Devenir Livreur</a>
        </div>
      </div>
    </div>
  </div>
</section>
