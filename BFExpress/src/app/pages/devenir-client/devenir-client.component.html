<section class="page-section">
  <div class="container">
    <div class="form-card">
      <form (submit)="onSubmit()">
        <div class="grid grid-2">
          <div class="field-group">
            <label>Prénom</label>
            <input name="prenom" [(ngModel)]="prenom" placeholder="Prénom" required />
          </div>
          <div class="field-group">
            <label>Nom</label>
            <input name="nom" [(ngModel)]="nom" placeholder="Nom" required />
          </div>
        </div>
        <div class="field-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required />
        </div>
        <div class="field-group">
          <label>Mot de passe</label>
          <input type="password" name="motDePasse" [(ngModel)]="motDePasse" placeholder="Choisissez un mot de passe" required />
        </div>
        <div class="field-group">
          <label>Téléphone</label>
          <input name="telephone" [(ngModel)]="telephone" placeholder="Téléphone" required />
        </div>
        <div class="field-group">
          <label>Nom de l'entreprise (Optionnel)</label>
          <input name="entreprise" [(ngModel)]="entreprise" placeholder="Ex: Timsoft" />
        </div>
        
        <div class="error-banner" *ngIf="errorMessage">
          ⚠️ {{ errorMessage }}
        </div>
        <div class="success-banner" *ngIf="successMessage">
          🎉 {{ successMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Envoi en cours...' : 'Envoyer ma demande' }}
        </button>
      </form>
    </div>
  </div>
</section>
